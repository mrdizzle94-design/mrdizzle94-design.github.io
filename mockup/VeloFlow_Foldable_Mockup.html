<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>VeloFlow Foldable Mockup</title>
<style>
:root{--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--muted:#5f6368}
html,body{margin:0;height:100%}
body{background:var(--bg,#e8f0fe);display:grid;place-items:center;font-family:var(--font)}
body.dark{--bg:#0b0f17} body.white{--bg:#ffffff}
.stage{width:min(900px,92vw);display:grid;place-items:center;padding:60px 0}
.duo{width:min(820px,100%)!important}
.bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:8px;font:500 14px var(--font)}
.bar button{border:1px solid #c8ccd2;background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer}
/* VeloFlow foldable, modelled as a solid device. Each half is a real slab: the screen on top, then
   stacked rounded chrome layers down to the back, so the rails follow the rounded corners from any angle.
   Motion is weighted: the cover starts slowly, swings, settles a few degrees past flat when opening and lands
   softly when closing, while the whole device turns a beat behind it. Everything that moves animates only
   transform or opacity, so it stays on the GPU and never repaints mid-motion. */
.duo{--t:clamp(8px,2.2vw,14px);--dur:2.2s;--swing:cubic-bezier(.5,.02,.18,1);margin:0;width:min(580px,100%);display:grid;justify-items:center;gap:22px;perspective:1500px;perspective-origin:50% 35%;cursor:pointer;position:relative}
.duo::after{content:"";position:absolute;left:8%;width:82%;top:86%;height:10%;border-radius:50%;background:radial-gradient(closest-side,rgba(20,24,40,.42),rgba(20,24,40,0));z-index:-1;transform-origin:100% 50%;transition:transform calc(var(--dur) + .2s) var(--swing) .05s}
.duo:not(.open)::after{transform:translateX(4.9%) scaleX(.634)}
.duo-stage{position:relative;width:100%;aspect-ratio:1813/1270;transform-style:preserve-3d;will-change:transform;transform:rotateX(8deg) rotateY(-12deg);transition:transform calc(var(--dur) + .2s) var(--swing) .05s}
.duo:not(.open) .duo-stage{transform:translateX(-24%) rotateX(8deg) rotateY(-30deg)}
.duo-right,.duo-leaf{position:absolute;top:0;height:100%;width:50.19%;transform-style:preserve-3d}
.duo-right{right:0}
.duo-leaf{left:0;transform-origin:100% 50% 0;will-change:transform;transform:rotateY(0deg) translateZ(.5px)}
.duo:not(.open) .duo-leaf{transform:rotateY(180deg) translateZ(.5px)}
.duo.ready.open .duo-leaf{animation:leafOpen var(--dur) both}
.duo.ready:not(.open) .duo-leaf{animation:leafClose calc(var(--dur) * .95) both}
@keyframes leafOpen{
  0%{transform:rotateY(180deg) translateZ(.5px);animation-timing-function:cubic-bezier(.55,0,.25,1)}
  80%{transform:rotateY(-3deg) translateZ(.5px);animation-timing-function:cubic-bezier(.35,0,.35,1)}
  100%{transform:rotateY(0deg) translateZ(.5px)}}
@keyframes leafClose{
  0%{transform:rotateY(0deg) translateZ(.5px);animation-timing-function:cubic-bezier(.55,0,.3,1)}
  86%{transform:rotateY(180deg) translateZ(.5px);animation-timing-function:ease-out}
  93%{transform:rotateY(177.5deg) translateZ(.5px);animation-timing-function:ease-in}
  100%{transform:rotateY(180deg) translateZ(.5px)}}
.duo .face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.duo-right .face,.duo-right .slab{border-radius:0 7% 7% 0 / 0 10% 10% 0}
.duo-leaf .front,.duo-leaf .slab{border-radius:7% 0 0 7% / 10% 0 0 10%}
.duo-leaf .back{transform:translateZ(calc(var(--t) * -1)) rotateY(180deg);border-radius:0 7% 7% 0 / 0 10% 10% 0}
.duo img{display:block;width:100%;height:100%}
/* the body: chrome layers with hard bright and dark reflection bands; the fold side is the dark hinge */
.duo .slab{--ant:linear-gradient(180deg,transparent 11%,rgba(120,118,114,.55) 11%,rgba(120,118,114,.55) 12%,transparent 12.2%,transparent 87.8%,rgba(120,118,114,.55) 88%,rgba(120,118,114,.55) 89%,transparent 89%);position:absolute;inset:0;transform:translateZ(calc(var(--t) * var(--z) * -1))}
.duo-right .slab{background:linear-gradient(90deg,#15171b 0 4px,transparent 4px),var(--ant),var(--c)}
.duo-leaf .slab{background:linear-gradient(270deg,#15171b 0 4px,transparent 4px),var(--ant),var(--c)}
/* hinge spine: a rounded metal barrel on the fold side, visible while the device is closed or moving */
.duo .hinge{position:absolute;left:0;top:1.5%;height:97%;width:calc(var(--t) * 2.2);transform-origin:0 50%;
  transform:translateZ(calc(var(--t) * -1.1)) rotateY(-90deg);border-radius:calc(var(--t) * 1.1);
  background:linear-gradient(90deg,#8a9097,#dfe3e8 20%,#ffffff 38%,#c4c9cf 58%,#9aa0a7 78%,#6c7279);transition:opacity .3s;transition-delay:calc(var(--dur) * .4)}
.duo.open .hinge{opacity:0;transition:opacity .35s;transition-delay:calc(var(--dur) * .3)}
/* light falloff: a half facing away from the viewer goes dark; the cover is fully lit again by the time it lands */
.duo .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.85),rgba(0,0,0,.45));opacity:0;transition:opacity var(--dur) var(--swing)}
.duo:not(.open) .front .shade{opacity:1}
.duo.open .back .shade{opacity:1;transition:opacity calc(var(--dur) * .5) ease-in}
.duo:not(.open) .back .shade{transition:opacity calc(var(--dur) * .55) ease-out}
.duo:not(.open) .duo-right .shade{opacity:1;transition-delay:0s}
.duo-right .shade{background:rgba(5,7,12,.92);transition-delay:.25s}
/* glass glare: a wide sheet that slides across as the device opens (transform only) */
.duo .glare{position:absolute;top:0;left:0;height:100%;width:300%;background:linear-gradient(112deg,transparent 40%,rgba(255,255,255,.15) 47%,rgba(255,255,255,.04) 52%,transparent 60%);transform:translateX(0);transition:transform calc(var(--dur) * 1.15) var(--swing);pointer-events:none}
.duo.open .glare{transform:translateX(-66.7%)}
/* at rest the open device is one seamless image; the two halves only carry the motion */
.duo .duo-full{position:absolute;inset:0;transform:translateZ(1.5px);opacity:0;transition:opacity .3s}
.duo.open .duo-full{opacity:1;transition-delay:calc(var(--dur) - .05s)}
/* chrome rim around the glass, on every outer edge, with a glint that travels around it (transform only) */
.duo .rim{position:absolute;inset:0;border-radius:inherit;padding:clamp(3px,.8vw,5px);pointer-events:none;overflow:hidden;
  background:linear-gradient(115deg,#ffffff 0%,#c9ced4 7%,#5d636a 14%,#f4f6f8 21%,#ffffff 25%,#8b9197 33%,#2f343a 41%,#d6dadf 49%,#ffffff 53%,#9ea4ab 61%,#454b52 70%,#e9ecef 79%,#ffffff 84%,#7c8289 92%,#cfd3d8 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.duo-right .face .rim,.duo-leaf .back .rim{padding-left:0}
.duo-leaf .front .rim{padding-right:0}
.duo .duo-rim{border-radius:3.5% / 10%;transform:translateZ(1.6px);opacity:0;transition:opacity .3s}
.duo.open .duo-rim{opacity:1;transition-delay:calc(var(--dur) - .05s)}
@media (prefers-reduced-motion:reduce){.duo-stage,.duo::after,.duo .shade,.duo .glare,.duo .hinge,.duo .duo-full,.duo .duo-rim{transition:none}.duo .duo-leaf{animation:none!important}}
</style></head><body>
